# Local development database.
#
# Disposable Postgres so the app and its tests can run without touching a shared
# cloud database. Managed through `pnpm local:db:*` — see README.
name: itsutsu-local

services:
  db:
    image: postgres:17-alpine
    container_name: itsutsu-localdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: itsutsu
      POSTGRES_PASSWORD: itsutsu
      POSTGRES_DB: itsutsu
    ports:
      # Deliberately not 5432, and not 55432 or 55433, which other local projects already hold.
      - "55434:5432"
    volumes:
      - itsutsu-localdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsutsu -d itsutsu"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  itsutsu-localdb:
