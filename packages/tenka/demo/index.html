<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tenka world conquest</title>
    <meta name="description" content="Tenka 天下: the classic world-conquest game on a map of the modern world, against the computer." />
    <meta name="theme-color" content="#2f5d4a" />
    <style>
      :root { color-scheme: light dark; --page: #f4efe4; --ink: #1f2320; }
      @media (prefers-color-scheme: dark) { :root { --page: #141614; --ink: #ece8dc; } }
      body { margin: 0; background: var(--page); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
      header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
      h1 { margin: 0; font-size: 1.8rem; }
      h1 span { font-size: 1rem; opacity: .6; margin-left: 6px; font-weight: 500; }
      header p { margin: 0; opacity: .7; }
      form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
      select, button { font: inherit; padding: 6px 10px; border-radius: 8px; }
      footer { margin-top: 32px; font-size: .85rem; opacity: .7; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Tenka<span lang="ja">天下</span></h1>
        <p>Take the world, one territory at a time.</p>
      </header>
      <form id="setup">
        <label>Players <select name="players"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label>
        <label>Length <select name="rounds"><option value="10">10 rounds</option><option value="20" selected>20 rounds</option><option value="60">The whole world</option></select></label>
        <button type="submit">New game</button>
      </form>
      <div id="table"></div>
      <footer>
        You play the first seat; the computer plays the rest. Tap your territories to place armies; to attack or move,
        tap where from and then where to. Open source under the MIT licence. The map is drawn from Natural Earth, which is in the public domain.
      </footer>
    </main>
    <script type="module">
      import { mountTenka } from "./dist/ui.js";
      const names = ["You", "Kaze", "Yama", "Umi", "Sora", "Mori"];
      const form = document.getElementById("setup");
      const read = () => {
        const count = Number(form.players.value);
        return { players: names.slice(0, count), rounds: Number(form.rounds.value) };
      };
      const table = mountTenka(document.getElementById("table"), read());
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        table.newGame(read());
      });
    </script>
  </body>
</html>
