<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gomoku">
  <title>Gomoku</title>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cf95"/>
      <stop offset="0.55" stop-color="#e2ba7a"/>
      <stop offset="1" stop-color="#d09f57"/>
    </linearGradient>
    <radialGradient id="black" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#6b6b6b"/>
      <stop offset="0.45" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="white" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ededed"/>
      <stop offset="1" stop-color="#bcbcbc"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#board)"/>

  <!-- Three grid lines each way. Kept sparse so they survive a 16px render. -->
  <g stroke="#6b4720" stroke-width="2.4" stroke-linecap="round" opacity="0.75">
    <path d="M18 18H46M18 32H46M18 46H46"/>
    <path d="M18 18V46M32 18V46M46 18V46"/>
  </g>

  <!-- Five in a row, on the diagonal: black closing the line. -->
  <circle cx="18" cy="46" r="7.4" fill="url(#black)"/>
  <circle cx="32" cy="32" r="7.4" fill="url(#black)"/>
  <circle cx="46" cy="18" r="7.4" fill="url(#white)"/>
</svg>
