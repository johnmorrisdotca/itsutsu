name: JMdict refresh

# THE KANA WORDDROP'S WORDS, KEPT CURRENT. JMdict's licence (EDRDG, clause 4,
# https://www.edrdg.org/edrdg/licence.html, read 2026-09-25) asks a site using
# its data for "a procedure for regular updating… at least once a month";
# John chose that on 2026-09-25 (docs/plans/other/WORD-04-kana.md).
#
# On the 1st of each month this fetches the newest JMdict and writes the kana
# lists again (scripts/word-lists-ja.mjs). If they changed, it pushes them to a
# branch, data/jmdict-YYYY-MM, and FAILS on purpose, so the failure is the
# reminder: an agent lands the branch through the ordinary gated release.
# It opens no pull request and never pushes to main (John, 2026-09-25: "don't
# make any prs without my permission"), the way UmaKuma's EDRDG refresh works.
# A push to a branch that is not main starts no other workflow here, so a month
# with a change costs one short run and nothing else.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch the newest JMdict
        run: curl -sSfL -o "$RUNNER_TEMP/JMdict_e.gz" http://ftp.edrdg.org/pub/Nihongo/JMdict_e.gz
      - name: Write the kana lists
        run: node scripts/word-lists-ja.mjs "$RUNNER_TEMP/JMdict_e.gz"
      - name: Leave the new lists on a branch, and say so by failing
        run: |
          if git diff --quiet -- src/lib/puzzles/wordDropKana; then
            echo "The kana lists are what JMdict's newest release makes. Nothing to land."
            exit 0
          fi
          branch="data/jmdict-$(date -u +%Y-%m)"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/lib/puzzles/wordDropKana
          git commit -m "The kana word lists from JMdict's newest release"
          git push --force origin "$branch"
          echo "::error::JMdict changed the kana lists. Land $branch through the ordinary release (pnpm release:take), then delete the branch."
          exit 1
