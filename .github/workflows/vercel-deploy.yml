name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm quality:check

      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm security:check; then
              echo "Audit clean on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Audit attempt $attempt failed; retrying in 20s."
              sleep 20
            fi
          done
          echo "::error::Audit failed three times. A repeated finding is real; a repeated timeout means the registry is down."
          exit 1

      - name: Build app
        run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DIRECT_URL: postgresql://build:build@localhost:5432/build

  # The browser suite gates the release. It runs alongside `verify` rather
  # than after it, so the slowest of the two sets the pace instead of their
  # sum, and `deploy` waits for both.
  #
  # This is the point of the whole arrangement: a deploy that takes longer and
  # cannot ship a broken click is worth more than a fast one that can. Before
  # this existed, nothing between a commit and production had ever opened a
  # browser.
  e2e:
    uses: ./.github/workflows/e2e.yml

  deploy:
    needs: [verify, e2e]
    if: needs.verify.result == 'success' && needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DIRECT_URL: postgresql://build:build@localhost:5432/build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # This project keeps real migrations, so the database is brought up to
      # the committed schema here, before the new code is live. Every
      # migration is additive, which is what lets the old deployment keep
      # serving while this one is uploaded.
      #
      # The credentials come from this repository's own secrets rather than
      # from `vercel pull`. Both database URLs are marked Sensitive in Vercel,
      # and a Sensitive variable is deliberately never handed back — the pull
      # writes a placeholder in its place, which is not a scheme Prisma
      # recognises, so this step failed with P1013 while looking for all the
      # world like a broken database. That is Vercel working as intended, so
      # the fix is to give the step credentials of its own.
      - name: Apply migrations to production
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.MIGRATE_DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "::error::MIGRATE_DATABASE_URL and MIGRATE_DIRECT_URL must be set as repository secrets. See the note above this step."
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::MIGRATE_DATABASE_URL is not a postgres:// URL. A Vercel Sensitive variable pulls as a placeholder; use the connection string from Neon."
              exit 1
              ;;
          esac
          pnpm exec prisma migrate deploy
          pnpm db:drift:check && echo "Production schema matches prisma/schema.prisma."

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # The upload is the one network call with no other safety net, and
      # `cancel-in-progress` above is what makes a retry safe: a superseded
      # run is killed before its retry could re-alias production to older code.
      - name: Deploy prebuilt output to production
        run: |
          for attempt in 1 2 3; do
            if vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}; then
              echo "Deployed on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Deploy attempt $attempt failed; retrying in 15s."
              sleep 15
            fi
          done
          echo "::error::Deploy failed three times. Read the upload errors above."
          exit 1
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
