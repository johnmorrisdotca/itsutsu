name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm quality:check

      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm security:check; then
              echo "Audit clean on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Audit attempt $attempt failed; retrying in 20s."
              sleep 20
            fi
          done
          echo "::error::Audit failed three times. A repeated finding is real; a repeated timeout means the registry is down."
          exit 1

      - name: Build app
        run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DIRECT_URL: postgresql://build:build@localhost:5432/build

  # The browser suite. It is MEANT to gate the release, and one day soon it
  # will — see the comment on `deploy` below for the switch and why it is not
  # thrown yet. Today it runs and reports, alongside `verify` rather than after
  # it, so the slower of the two sets the pace instead of their sum.
  #
  # The arrangement it is heading for is the point: a deploy that takes longer
  # and cannot ship a broken click is worth more than a fast one that can.
  # Before this existed, nothing between a commit and production had ever
  # opened a browser.
  e2e:
    uses: ./.github/workflows/e2e.yml
    # Sumilabu's dev project only, never the live tokens, and by name rather
    # than `secrets: inherit` — see e2e.yml, where they are used.
    secrets:
      SUMILABU_BOARD_URL: ${{ secrets.SUMILABU_BOARD_URL }}
      SUMILABU_BOARD_DEV_TOKEN: ${{ secrets.SUMILABU_BOARD_DEV_TOKEN }}
      SUMILABU_SETTINGS_DEV_TOKEN: ${{ secrets.SUMILABU_SETTINGS_DEV_TOKEN }}

  deploy:
    # THE BROWSER GATE IS DELIBERATELY OFF. These are the two lines that turn
    # it on, and they replace the two below:
    #
    #     needs: [verify, e2e]
    #     if: needs.verify.result == 'success' && needs.e2e.result == 'success'
    #
    # `e2e` must come out of `needs` to be off, not merely out of the `if`. A
    # job listed in `needs` is SKIPPED when that need fails, whatever the `if`
    # says, unless the condition calls always() or !cancelled() — so leaving
    # the name there and softening the condition reads like an off switch and
    # is a gate.
    #
    # The `e2e` job above still runs on every push; it just cannot stop a
    # deploy yet. That is the point of landing it this way round. The suite has
    # never once been executed by this runner, and a job whose first ever run
    # is also a release gate can only announce itself by blocking every deploy
    # there is — leaving us to read a red run with no way to tell a real bug
    # from a cold runner. It reports first and gates second.
    #
    # Switch the lines once it has passed here on its own, and delete this.
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DIRECT_URL: postgresql://build:build@localhost:5432/build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # This project keeps real migrations, so the database is brought up to
      # the committed schema here, before the new code is live. Every
      # migration is additive, which is what lets the old deployment keep
      # serving while this one is uploaded.
      #
      # The credentials come from this repository's own secrets rather than
      # from `vercel pull`. Both database URLs are marked Sensitive in Vercel,
      # and a Sensitive variable is deliberately never handed back — the pull
      # writes a placeholder in its place, which is not a scheme Prisma
      # recognises, so this step failed with P1013 while looking for all the
      # world like a broken database. That is Vercel working as intended, so
      # the fix is to give the step credentials of its own.
      - name: Apply migrations to production
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.MIGRATE_DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "::error::MIGRATE_DATABASE_URL and MIGRATE_DIRECT_URL must be set as repository secrets. See the note above this step."
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::MIGRATE_DATABASE_URL is not a postgres:// URL. A Vercel Sensitive variable pulls as a placeholder; use the connection string from Neon."
              exit 1
              ;;
          esac
          pnpm exec prisma migrate deploy
          pnpm db:drift:check && echo "Production schema matches prisma/schema.prisma."

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # The upload is the one network call with no other safety net, and
      # `cancel-in-progress` above is what makes a retry safe: a superseded
      # run is killed before its retry could re-alias production to older code.
      - name: Deploy prebuilt output to production
        run: |
          for attempt in 1 2 3; do
            if vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}; then
              echo "Deployed on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Deploy attempt $attempt failed; retrying in 15s."
              sleep 15
            fi
          done
          echo "::error::Deploy failed three times. Read the upload errors above."
          exit 1
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # KEEP THE LIVE DEPLOYMENT AND THE ONE BEFORE IT. Every deployment Vercel keeps is
      # counted against the account's Functions Storage and Deployment Storage,
      # and this project deploys on every push to main, so the old ones piled up
      # until the Hobby account was at 144 GB of a 10 GB allowance (2026-09-15).
      # John: "we don't need to keep deployments!!", and then "really you should
      # be keeping 1 previous backup, no?" — so the release before the live one
      # stays, as an instant rollback, and nothing older.
      #
      # ONE ADDRESS PER CALL, NEVER A LIST AND NEVER THE PROJECT NAME. On
      # 2026-09-15 `vercel remove itsutsu --safe` sat for ten minutes at no CPU
      # with over a hundred deployments, and `vercel remove <twenty urls>` hung the
      # same way; `vercel remove <one url> --safe` answered in two seconds, every
      # time. The newest deployment is the one the step above has just put
      # on itsutsu.com — `concurrency` means no other deploy of this project is
      # building — so it and the ready deployment before it are left out of the list, and `--safe` skips anything
      # still carrying an alias as a second guard. `--safe` skips an aliased
      # deployment without an error, so a round that asks for exactly what the
      # round before asked for has removed nothing and never will: the step says
      # which addresses are left and stops there, rather than going red on every
      # deploy while the site is fine. The timeout is what stops a stuck call from
      # holding the job for GitHub's six hours, and a failed list or remove still
      # fails the step, because a cleanup that quietly stops is how the storage
      # came back.
      - name: Remove superseded deployments
        timeout-minutes: 10
        run: |
          previous=""
          for round in $(seq 1 20); do
            urls=$(vercel list itsutsu --json --limit 100 --token="$VERCEL_TOKEN" \
              | jq -r '(.deployments | map(select(.state == "READY")) | .[2:][]), (.deployments[] | select(.state == "ERROR" or .state == "CANCELED")) | .url' \
              )
            if [ -z "$urls" ]; then
              echo "Only the live deployment and the one before it are kept (round $round)."
              exit 0
            fi
            if [ "$urls" = "$previous" ]; then
              echo "::warning::Only aliased deployments remain: $(echo $urls)"
              exit 0
            fi
            for url in $urls; do
              # --safe exits 1 on a deployment a domain still points at, and bash -e
              # would end the step there; the no-progress check below decides instead.
              vercel remove "$url" --safe --yes --token="$VERCEL_TOKEN" \
                || echo "Kept $url: a domain still points at it."
            done
            previous="$urls"
          done
          echo "::error::Superseded deployments were still listed after 20 rounds."
          exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
