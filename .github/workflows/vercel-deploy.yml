name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm quality:check

      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm security:check; then
              echo "Audit clean on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Audit attempt $attempt failed; retrying in 20s."
              sleep 20
            fi
          done
          echo "::error::Audit failed three times. A repeated finding is real; a repeated timeout means the registry is down."
          exit 1

      - name: Build app
        run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DIRECT_URL: postgresql://build:build@localhost:5432/build

  deploy:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DIRECT_URL: postgresql://build:build@localhost:5432/build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # This project keeps real migrations, so the database is brought up to
      # the committed schema here, before the new code is live. Every
      # migration is additive, which is what lets the old deployment keep
      # serving while this one is uploaded.
      - name: Apply migrations to production
        run: |
          ENV_FILE=.vercel/.env.production.local
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE not found; 'vercel pull' did not write the production env."
            exit 1
          fi
          set -a
          . "$ENV_FILE"
          set +a
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "::error::DATABASE_URL or DIRECT_URL missing from the pulled production env."
            exit 1
          fi
          pnpm exec prisma migrate deploy
          pnpm db:drift:check && echo "Production schema matches prisma/schema.prisma."

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # The upload is the one network call with no other safety net, and
      # `cancel-in-progress` above is what makes a retry safe: a superseded
      # run is killed before its retry could re-alias production to older code.
      - name: Deploy prebuilt output to production
        run: |
          for attempt in 1 2 3; do
            if vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}; then
              echo "Deployed on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Deploy attempt $attempt failed; retrying in 15s."
              sleep 15
            fi
          done
          echo "::error::Deploy failed three times. Read the upload errors above."
          exit 1
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
