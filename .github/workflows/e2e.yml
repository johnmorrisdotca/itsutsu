name: End-to-end

# Called by ci.yml and by vercel-deploy.yml, which gates its deploy on it.
# One definition with two callers, so the suite that guards a release and the
# suite that guards a pull request can never quietly drift apart.
on:
  workflow_call:
    # Sumilabu's DEV project, and only that: see the step that runs the suite.
    # Passed by name from each caller rather than `secrets: inherit`, so this
    # job never holds the deploy token or the production database's URL.
    # Optional so a run with them unset still starts; the specs that need
    # them then fail naming the missing variable, which is the honest report.
    secrets:
      SUMILABU_BOARD_URL:
        required: false
      SUMILABU_BOARD_DEV_TOKEN:
        required: false
      SUMILABU_SETTINGS_DEV_TOKEN:
        required: false

jobs:
  playwright:
    # MUST STAY ON A STANDARD RUNNER. GitHub Actions is free on standard
    # GitHub-hosted runners for public repositories, and this repository is
    # public — so this whole job costs nothing. The larger runner tiers are
    # NOT free even on a public repo, and moving this to one is the single
    # way this acquires a bill.
    runs-on: ubuntu-latest
    # FOUR SHARDS, EACH ON ONE WORKER AGAINST ITS OWN DATABASE.
    #
    # The suite is 176 spec files, about eight hundred cases, and it ran on
    # ONE worker for a reason that still holds: every spec shares one database
    # and parallel workers corrupt each other's fixtures (playwright.config.ts
    # sets `workers: 1`, and says why). On a cold runner that was about fifty
    # minutes a run, and John, waiting on one: "can we not increase the speed
    # of these tests?"
    #
    # Sharding is the answer that changes nothing about that rule. Each shard
    # is a job of its own — its own runner, its OWN service container below,
    # its own quarter of the spec files — and inside it the suite still runs
    # on one worker against one database. Four databases, not one shared
    # four ways. Playwright runs the `setup` project on every shard that has
    # tests depending on it, so each shard signs in and sweeps its own fresh
    # database exactly as the single job did.
    #
    # `fail-fast: false`, because a red shard must not cancel the other three:
    # a superseded test run is evidence, and three quarters of the evidence is
    # worth having when one quarter is red.
    #
    # THE CEILING IS PER SHARD. A job killed by it is reported as `cancelled`,
    # NOT `failed` — indistinguishable in `gh run list` from somebody pressing
    # cancel, which cost a while to work out — so it is set well clear of a
    # quarter of the old fifty minutes, not just above it.
    #
    # Free, still: four standard runners on a public repository cost nothing,
    # which the note above the runner is about. Four larger runners would.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 30

    services:
      # Postgres runs ON the runner and is thrown away with it. No Neon usage,
      # and nothing here touches the real database.
      #
      # That is not only a matter of the URL below being right. `tidy.ts`
      # DELETES rows, and it asks `isLocalDatabase()` first, which answers true
      # only for localhost, 127.0.0.1 and ::1 — and false for anything it
      # cannot parse, because a guard that treats "I do not understand this"
      # as "go ahead" is not a guard. A service container answers on localhost.
      # Production is a Neon hostname. So the deleting code in this suite
      # CANNOT be pointed at production from here, whatever is exported.
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: itsutsu
          POSTGRES_PASSWORD: itsutsu
          POSTGRES_DB: itsutsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsutsu -d itsutsu"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The suite reads `.env` directly — `process.loadEnvFile(".env")` in
      # e2e/tidy.ts, e2e/members.ts and one spec — and throws if it is absent,
      # so job-level environment variables alone are not enough. Every value
      # here is a throwaway against the container above; no real credential
      # goes into this file. The one real credential this job holds is
      # Sumilabu's dev project's, given to the step that runs the suite and
      # to no other — see there.
      #
      # See .env.example, which explains each of these and why the relief is
      # set. RATE_LIMIT_RELIEF is not optional: without it the suite drives
      # the whole site from one address and a dozen tests fail with 429s in
      # files testing something else entirely.
      #
      # The two AUTH_GOOGLE_* values are throwaways and nothing ever redeems
      # them, but they must be PRESENT: without a client id the sign-in button
      # is not rendered at all, and `gate.spec.ts` fails looking for a control
      # the environment cannot produce. That is the suite reporting a missing
      # variable as a missing button, which reads like a broken page.
      - name: Write the .env the suite expects
        run: |
          cat > .env <<'ENV'
          DATABASE_URL="postgresql://itsutsu:itsutsu@localhost:5432/itsutsu"
          DIRECT_URL="postgresql://itsutsu:itsutsu@localhost:5432/itsutsu"
          AUTH_SECRET="ci-only-not-a-real-secret"
          ADMIN_EMAILS="operator@example.test"
          ADMIN_TOKEN="ci-only-operator-token"
          NEXTAUTH_URL="http://localhost:6600"
          AUTH_GOOGLE_ID="ci-only-not-a-real-client-id"
          AUTH_GOOGLE_SECRET="ci-only-not-a-real-client-secret"
          RATE_LIMIT_RELIEF=20
          ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `migrate deploy` applies the committed migrations and never generates
      # one, so a schema that has drifted from its migrations fails here rather
      # than being papered over.
      - name: Bring the throwaway database up to the committed schema
        run: pnpm exec prisma migrate deploy

      # Chromium only: playwright.config.ts defines two projects and both use
      # Desktop Chrome.
      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      # Playwright starts the dev server itself — see `webServer` in
      # playwright.config.ts — and `reuseExistingServer` finds nothing to reuse
      # on a fresh runner, so it gets a clean one on port 6600.
      #
      # IT MUST BE THE DEV SERVER. Swapping this for `pnpm build && pnpm start`
      # to make the run faster is the obvious optimisation and it breaks the
      # suite: `next start` sets NODE_ENV=production, and BOTH reliefs are
      # deliberately ignored in production — `allowanceFor()` in
      # src/lib/api/rateLimit.ts and `activeGameLimit()` in
      # src/lib/history/activeGames.ts each return the unrelieved number as
      # their first act. The suite would then drive the whole site from one
      # address against household-scale limits and fail a dozen specs with
      # 429s, in files testing something else entirely, with nothing naming
      # the cause. That is the single most expensive wrong turn available here.
      #
      # THE BOARD AND THE SITE'S SETTINGS LIVE ON SUMILABU (0.196.1, 0.196.2),
      # so the dev server needs somewhere to read them. Without these, every
      # page touching either answers "Sumilabu's board for itsutsu-dev needs
      # SUMILABU_BOARD_URL and SUMILABU_BOARD_DEV_TOKEN", and ten specs across
      # backlog, backlog-detail, site-settings and control-names fail on a
      # missing variable that reads like a broken page.
      #
      # THE DEV PROJECT ONLY, NEVER THE LIVE TOKENS. `sumilabuTarget` answers
      # itsutsu-dev when SUMILABU_PROJECT_KEY is unset, refuses the live
      # project outside NODE_ENV=production (and this is the dev server — see
      # above), and the dev project reads only these two tokens. Nothing here
      # sets SUMILABU_BOARD_TOKEN or SUMILABU_SETTINGS_TOKEN, and nothing may.
      #
      # On this step and no other: `pnpm install` runs dependencies' install
      # scripts, and they have no business with a token. Playwright's
      # `webServer` inherits this environment, so the dev server it starts
      # reads them; Next's `.env` loading never overrides a variable already
      # set. A pull request from a fork is given no secrets by GitHub, so
      # those ten specs fail there by design.
      # This shard's quarter of the spec files. Playwright splits the FILES
      # across shards evenly by count, and the `setup` project runs on each.
      #
      # `pnpm exec playwright test`, NOT `pnpm test:e2e -- --shard=…`. The
      # first attempt used the script with a `--` before the flag, which is
      # npm's way of separating them and is not pnpm's: pnpm forwards the
      # `--` itself, so the runner read `playwright test -- --shard=1/4` and
      # playwright took everything after `--` as a filename filter matching
      # nothing in particular. Every shard then ran the WHOLE suite — the log
      # says `Running 850 tests` on all four — and all four were killed by
      # the ceiling below at exactly thirty minutes, which reads as four
      # failures and was one typo.
      #
      # The flag going missing is the failure worth designing against, because
      # a shard that ignores it does not error: it runs more tests and passes
      # more slowly. Naming the binary leaves nothing between the flag and the
      # thing that reads it.
      - name: Run this shard of the end-to-end suite
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/4
        env:
          SUMILABU_BOARD_URL: ${{ secrets.SUMILABU_BOARD_URL }}
          SUMILABU_BOARD_DEV_TOKEN: ${{ secrets.SUMILABU_BOARD_DEV_TOKEN }}
          SUMILABU_SETTINGS_DEV_TOKEN: ${{ secrets.SUMILABU_SETTINGS_DEV_TOKEN }}

      # Only on failure, and only for a fortnight: the traces are what make a
      # red run diagnosable without reproducing it locally, and they are large.
      # Named per shard, since two jobs cannot upload one artifact name.
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
