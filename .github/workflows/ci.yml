name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Every commit pushed to main gets a CI run of its own, and nothing cancels it.
#
# A superseded TEST RUN is evidence: it is the only record of whether the
# commit it was started for was sound, and on a bisect it is the thing you go
# looking for. That is the opposite of vercel-deploy.yml, where a superseded
# DEPLOY is worthless and cancel-in-progress rightly kills it.
#
# This used to be ONE group per branch, `ci-${{ github.ref }}`, with
# `cancel-in-progress: false`, under a comment saying runs were QUEUED. They
# were not. GitHub keeps at most one running and ONE pending run per group,
# and a newly queued run cancels the pending one whatever cancel-in-progress
# says — that flag only decides whether the RUNNING one dies too:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
# With the browser suite taking about forty minutes, every push that landed
# behind a running suite was cancelled the second the next push arrived, with
# no job ever started. On the night of 2026-09-14 that was 0.174.0, .1, .3,
# .4, .6, .7, .8, 0.175.0 and 0.176.0: no verdict at all, each `cancelled` in
# `gh run list` exactly as though somebody had pressed the button. A run that
# is `cancelled` with no jobs was replaced, not stopped.
#
# So a push is grouped by its commit. No run waits behind another, so none can
# be replaced. That gives up what the old group was for — one browser suite at
# a time — on purpose, and here is what it costs:
#
#   - Money: nothing. This repository is public, and Actions on standard
#     GitHub-hosted runners is free for public repositories (see e2e.yml for
#     why the suite must stay on one).
#   - Runners: overlapping runs share the account's concurrent-job limit, 20
#     on the Free plan. Six pushes in forty minutes, the busiest stretch so
#     far, is at most a dozen CI jobs beside the deploy's few. A job past the
#     limit waits for a runner; it is neither cancelled nor billed.
#   - Nothing shared: each e2e job gets its own throwaway Postgres on its own
#     runner, so overlapping suites cannot touch each other's rows.
#
# `queue: max` would keep one-at-a-time AND lose nothing, and it was the
# alternative weighed. It does not keep up: one forty-minute run at a time
# against a push every ten minutes leaves the verdict for a night's last merge
# hours behind it, which is a verdict nobody is still waiting for.
#
# A PULL REQUEST keeps one group per PR on the default queue: the run already
# going finishes, and a later push replaces a run that has not started,
# because only a PR's newest head is ever going to merge. A PR run can
# therefore read `cancelled` with no jobs, and that is this, not a person.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-push-{0}', github.sha) }}
  cancel-in-progress: false

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm quality:check

      # The audit is a network call to the registry. A timeout is not a
      # finding, so the network gets three chances; a real vulnerability fails
      # all three the same way and the gate stays exactly as strict.
      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm security:check; then
              echo "Audit clean on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Audit attempt $attempt failed; retrying in 20s."
              sleep 20
            fi
          done
          echo "::error::Audit failed three times. A repeated finding is real; a repeated timeout means the registry is down."
          exit 1

      - name: Build app
        run: pnpm build
        env:
          # The build needs a URL to generate the client; nothing connects to it.
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DIRECT_URL: postgresql://build:build@localhost:5432/build

  # The browser suite, which nothing here ran until now. Every "green on CI"
  # this project ever reported meant lint, typecheck and vitest only — so a
  # broken click could pass every gate there was, and once did: seven e2e
  # failures sat red through forty versions with nothing watching.
  #
  # It is a separate job so it runs alongside the checks above rather than
  # after them, and costs no extra wall clock on a public repo's free runners.
  e2e:
    uses: ./.github/workflows/e2e.yml
