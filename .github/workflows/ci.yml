name: CI

on:
  pull_request:
  push:
    branches:
      - main

# One CI run per ref at a time, QUEUED rather than cancelled.
#
# The browser suite is an hour's ceiling, and until this existed every push
# started another one with nothing to stop it — a night of ten merges had five
# overlapping runs testing trees nobody cared about any more, all competing for
# the same free runners.
#
# `cancel-in-progress: false` on purpose, and it is the opposite of what
# vercel-deploy.yml wants. A superseded DEPLOY is worthless, so that one kills
# its predecessor. A superseded TEST RUN is evidence: it is the only record of
# whether the commit it was started for was sound, and on a bisect it is the
# thing you go looking for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm quality:check

      # The audit is a network call to the registry. A timeout is not a
      # finding, so the network gets three chances; a real vulnerability fails
      # all three the same way and the gate stays exactly as strict.
      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm security:check; then
              echo "Audit clean on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Audit attempt $attempt failed; retrying in 20s."
              sleep 20
            fi
          done
          echo "::error::Audit failed three times. A repeated finding is real; a repeated timeout means the registry is down."
          exit 1

      - name: Build app
        run: pnpm build
        env:
          # The build needs a URL to generate the client; nothing connects to it.
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DIRECT_URL: postgresql://build:build@localhost:5432/build

  # The browser suite, which nothing here ran until now. Every "green on CI"
  # this project ever reported meant lint, typecheck and vitest only — so a
  # broken click could pass every gate there was, and once did: seven e2e
  # failures sat red through forty versions with nothing watching.
  #
  # It is a separate job so it runs alongside the checks above rather than
  # after them, and costs no extra wall clock on a public repo's free runners.
  e2e:
    uses: ./.github/workflows/e2e.yml
